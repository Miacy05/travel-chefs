<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFCF2">
<meta name="description" content="Travel Chefs 旅行大厨 —— Cook your way around the world. 像素风模拟经营烹饪游戏。">
<title>Travel Chefs · 旅行大厨</title>
<style>
/* ==========================================================================
   Travel Chefs 设计系统
   色板（严格 5 色，不新增）：
     暖黄 #FFD166 / 番茄红 #EF476F / 薄荷绿 #06D6A0 / 奶油白 #FFFCF2 / 深棕 #3D2B1F
   ========================================================================== */
:root{
  --yellow:#FFD166;
  --tomato:#EF476F;
  --mint:#06D6A0;
  --cream:#FFFCF2;
  --brown:#3D2B1F;

  --ink:var(--brown);
  --ink-70:rgba(61,43,31,.70);
  --ink-50:rgba(61,43,31,.50);
  --ink-30:rgba(61,43,31,.30);
  --ink-16:rgba(61,43,31,.16);
  --ink-08:rgba(61,43,31,.08);
  --ink-04:rgba(61,43,31,.04);

  --font-pixel:ui-monospace,"Cascadia Mono","Consolas","Courier New",monospace;
  --font-body:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,-apple-system,sans-serif;

  --bd:3px;
  --r-card:18px;
  --r-btn:16px;
  --shadow-card:0 4px 0 var(--ink-16);
  --shadow-btn:0 4px 0 var(--brown);
  --ease:cubic-bezier(.34,1.4,.5,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
/* [hidden] 必须真的隐藏：下面很多组件用类选择器设了 display，会盖过浏览器默认的 [hidden] */
[hidden]{display:none !important;}
html,body{height:100%;margin:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--brown);
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
h1,h2,h3,p{margin:0;}
ul{margin:0;padding:0;list-style:none;}

/* ---------- 像素标题 ---------- */
.pixel{
  font-family:var(--font-pixel);
  font-weight:700;
  letter-spacing:.04em;
  line-height:1.15;
}
.pixel-outline{
  text-shadow:
    -2px 0 0 var(--brown), 2px 0 0 var(--brown),
     0 -2px 0 var(--brown), 0 2px 0 var(--brown),
    -2px -2px 0 var(--brown), 2px -2px 0 var(--brown),
    -2px 2px 0 var(--brown), 2px 2px 0 var(--brown),
     0 5px 0 rgba(61,43,31,.22);
}

/* ==========================================================================
   App 外壳
   ========================================================================== */
#app{
  position:relative;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:440px;
  height:100vh;
  height:100dvh;
  margin:0 auto;
  background:var(--cream);
  overflow:hidden;
}
@media (min-width:480px){
  body{background:
    radial-gradient(circle at 20% 10%, rgba(255,209,102,.18), transparent 55%),
    radial-gradient(circle at 80% 90%, rgba(6,214,160,.14), transparent 55%),
    var(--brown);
    display:flex;align-items:center;justify-content:center;}
  #app{
    height:min(880px,96vh);
    border-radius:26px;
    border:var(--bd) solid var(--brown);
    box-shadow:0 18px 0 rgba(0,0,0,.28);
  }
}

/* ---------- 顶栏 ---------- */
#topbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:calc(8px + var(--safe-t)) 10px 8px;
  background:var(--cream);
  border-bottom:var(--bd) solid var(--brown);
  z-index:6;
}
.tb-pill{
  display:flex;align-items:center;gap:5px;
  height:30px;padding:0 10px;
  background:var(--cream);
  border:2px solid var(--brown);
  border-radius:999px;
  font-family:var(--font-pixel);
  font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;
  box-shadow:0 2px 0 var(--ink-16);
  white-space:nowrap;
}
.tb-pill .tb-ico{font-size:13px;line-height:1;filter:saturate(1.1);}
.tb-pill.is-gem{background:rgba(6,214,160,.14);}
.tb-mid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px;}
.tb-center{
  display:flex;align-items:baseline;gap:6px;justify-content:center;
  font-family:var(--font-pixel);font-size:13px;font-weight:700;
  min-width:0;
}
.tb-center .tbc-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-center .tbc-tag{
  font-size:9.5px;color:var(--ink-70);font-family:var(--font-body);
  border:1.5px solid var(--ink-30);border-radius:999px;padding:1px 6px;white-space:nowrap;
}
.tb-btn{
  flex:0 0 auto;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  background:var(--cream);
  border:2px solid var(--brown);
  border-radius:12px;
  font-size:16px;line-height:1;
  box-shadow:0 3px 0 var(--brown);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease);
}
.tb-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--brown);}
.tb-time{
  display:flex;align-items:center;gap:7px;
  font-family:var(--font-pixel);font-size:13px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.tb-time.is-low{color:var(--tomato);}
.tb-track{
  position:relative;flex:1 1 auto;height:9px;
  background:var(--ink-08);
  border:2px solid var(--brown);
  border-radius:999px;
  overflow:hidden;min-width:40px;
}
.tb-track > i{
  display:block;height:100%;width:100%;
  background:var(--mint);
  transition:width .25s linear,background .25s linear;
}
.tb-track.is-low > i{background:var(--tomato);}
.tb-combo{
  flex:0 0 auto;
  display:flex;align-items:center;gap:2px;
  font-family:var(--font-pixel);font-size:12px;font-weight:700;
  color:var(--tomato);
  opacity:0;transform:scale(.7);
  transition:opacity .2s,transform .2s var(--ease);
}
.tb-combo.is-on{opacity:1;transform:scale(1);}
.tb-combo.is-pop{animation:comboPop .5s var(--ease);}
@keyframes comboPop{
  0%{transform:scale(1)}
  35%{transform:scale(1.45) rotate(-4deg)}
  55%{transform:scale(1.45) rotate(4deg)}
  75%{transform:scale(1.2) rotate(-2deg)}
  100%{transform:scale(1)}
}

/* ---------- 视图 ---------- */
#views{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;}
.view{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transform:translateY(10px) scale(.995);
  transition:opacity .26s var(--ease),transform .32s var(--ease),visibility .26s;
  pointer-events:none;
}
.view.is-active{opacity:1;visibility:visible;transform:none;pointer-events:auto;}
.scroll{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:14px 14px 20px;
}

/* ---------- 通用卡片 / 按钮 ---------- */
.card{
  background:var(--cream);
  border:var(--bd) solid var(--brown);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;min-width:44px;
  padding:0 18px;
  border:var(--bd) solid var(--brown);
  border-radius:var(--r-btn);
  font-size:15px;font-weight:700;
  box-shadow:var(--shadow-btn);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease),opacity .2s;
  user-select:none;
}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--brown);}
.btn-primary{background:var(--tomato);color:var(--cream);}
.btn-yellow{background:var(--yellow);color:var(--brown);}
.btn-mint{background:var(--mint);color:var(--brown);}
.btn-ghost{background:var(--cream);color:var(--brown);}
.btn[disabled]{opacity:.42;pointer-events:none;}
.btn-sm{min-height:38px;font-size:13px;padding:0 13px;border-radius:12px;box-shadow:0 3px 0 var(--brown);}

/* ==========================================================================
   页面 1 · 世界地图
   ========================================================================== */
.hero{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 0 18px;
}
.hero-globe{position:relative;margin-bottom:0;}
/* 地球仪整块由 canvas 画（球体 + 经纬线 + 云 + 轨道 + 星星 + 小飞机），
   按钮本身只负责点击热区与按压缩放，不再自己画圆和描边。 */
.globe{
  position:relative;width:132px;height:132px;
  display:flex;align-items:center;justify-content:center;
  padding:0;border:0;border-radius:50%;
  background:none;box-shadow:none;
  transition:transform .14s var(--ease);
}
/* 球体背后的柔光：让地球仪从奶油底上"浮"起来（球本身画在 canvas 里） */
.globe::before{
  content:'';position:absolute;left:50%;top:50%;width:100px;height:100px;
  margin:-50px 0 0 -50px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--cream), var(--ink-04));
}
.globe:active{transform:scale(.94) translateY(2px);}
.globe.is-pop{animation:globePop .5s var(--ease);}
@keyframes globePop{0%{transform:scale(1)}40%{transform:scale(1.12) rotate(-5deg)}70%{transform:scale(1.05) rotate(4deg)}100%{transform:scale(1)}}
/* 注意：这里不能加 border-radius，否则轨道/星星/小飞机会被裁掉 */
.globe canvas{position:relative;width:132px;height:132px;}
.globe-taps{
  position:absolute;top:-4px;right:-6px;
  min-width:22px;height:22px;padding:0 5px;
  display:flex;align-items:center;justify-content:center;
  background:var(--yellow);border:2px solid var(--brown);border-radius:999px;
  font-family:var(--font-pixel);font-size:10px;font-weight:700;
  opacity:0;transform:scale(.5);
  transition:opacity .2s,transform .2s var(--ease);
}
.globe-taps.is-on{opacity:1;transform:scale(1);}
.hero-title{font-size:26px;text-align:center;color:var(--yellow);letter-spacing:.06em;}
.hero-sub{font-size:11.5px;color:var(--ink-70);letter-spacing:.06em;font-style:italic;}
.hero-sub-cn{font-size:12px;color:var(--ink-50);letter-spacing:.24em;margin-top:2px;}
.hero-stats{
  display:flex;align-items:center;gap:10px;margin-top:12px;
  padding:7px 15px;background:var(--cream);
  border:2px solid var(--brown);border-radius:999px;
  font-family:var(--font-pixel);font-size:11.5px;font-weight:700;
  box-shadow:0 3px 0 var(--ink-16);
}
.hero-stats b{color:var(--tomato);}
.hero-stats i{width:2px;height:12px;background:var(--ink-16);border-radius:2px;}

.region-list{display:flex;flex-direction:column;gap:11px;}
.region-card{
  position:relative;
  display:flex;align-items:stretch;gap:11px;
  padding:12px;width:100%;text-align:left;
  background:var(--cream);
  border:var(--bd) solid var(--brown);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  transition:transform .16s var(--ease),box-shadow .16s var(--ease);
  overflow:hidden;
}
.region-card:not(.is-locked):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink-16);}
.region-card.is-locked{background:var(--ink-04);}
.region-card.is-locked .rc-body{opacity:.5;}
.region-card.is-locked .rc-thumb{filter:grayscale(1) opacity(.45);}
.region-card.is-shake{animation:shake .42s var(--ease);}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.rc-thumb{
  flex:0 0 auto;width:62px;height:62px;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--brown);border-radius:14px;
  font-size:28px;line-height:1;
  background:var(--yellow);
  box-shadow:inset 0 -4px 0 rgba(61,43,31,.12);
}
.rc-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px;justify-content:center;}
.rc-top{display:flex;align-items:center;gap:6px;}
.rc-no{
  font-family:var(--font-pixel);font-size:9.5px;font-weight:700;
  color:var(--cream);background:var(--brown);
  border-radius:5px;padding:2px 5px;letter-spacing:.05em;
}
.rc-name{font-size:15px;font-weight:800;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rc-dish{font-size:11px;color:var(--ink-70);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rc-meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-50);font-family:var(--font-pixel);font-weight:700;}
.rc-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;}
.rc-stars{display:flex;gap:1px;font-size:12px;line-height:1;}
.rc-stars .st{color:var(--ink-16);}
.rc-stars .st.on{color:var(--yellow);text-shadow:0 1px 0 rgba(61,43,31,.35);}
.rc-lock{font-size:20px;line-height:1;}
.rc-need{
  font-size:10px;font-family:var(--font-pixel);font-weight:700;
  color:var(--tomato);white-space:nowrap;
  background:rgba(239,71,111,.1);border-radius:6px;padding:2px 5px;
}
.rc-clear{
  font-size:10px;font-family:var(--font-pixel);font-weight:700;
  color:var(--brown);background:var(--mint);border-radius:6px;padding:2px 6px;
}
.rc-decor{
  position:absolute;right:6px;bottom:5px;display:flex;gap:2px;font-size:11px;opacity:.9;
}
.map-foot{text-align:center;font-size:11px;color:var(--ink-30);margin-top:16px;letter-spacing:.1em;}

/* ==========================================================================
   地区关卡选择
   ========================================================================== */
.region-head{
  display:flex;align-items:center;gap:12px;
  padding:13px;margin-bottom:14px;
  border:var(--bd) solid var(--brown);border-radius:var(--r-card);
  background:var(--yellow);box-shadow:var(--shadow-card);
}
.region-head .rh-thumb{
  flex:0 0 auto;width:54px;height:54px;display:flex;align-items:center;justify-content:center;
  font-size:26px;background:var(--cream);border:2px solid var(--brown);border-radius:14px;
}
.region-head .rh-info{flex:1 1 auto;min-width:0;}
.region-head .rh-name{font-size:17px;font-weight:800;}
.region-head .rh-sub{font-size:11px;color:var(--ink-70);margin-top:3px;}
.level-list{display:flex;flex-direction:column;gap:10px;}
.level-row{
  display:flex;align-items:center;gap:11px;padding:11px 12px;
  background:var(--cream);border:var(--bd) solid var(--brown);
  border-radius:16px;box-shadow:var(--shadow-card);
  transition:transform .16s var(--ease),box-shadow .16s var(--ease);
}
.level-row:not(.is-locked):active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink-16);}
.level-row.is-locked{background:var(--ink-04);}
.level-row.is-locked .lr-body{opacity:.48;}
.lr-badge{
  flex:0 0 auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--brown);border-radius:13px;
  font-family:var(--font-pixel);font-size:14px;font-weight:700;
  background:var(--mint);color:var(--brown);
}
.level-row.is-locked .lr-badge{background:var(--ink-08);color:var(--ink-50);}
.lr-body{flex:1 1 auto;min-width:0;}
.lr-name{font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lr-sub{font-size:10.5px;color:var(--ink-70);margin-top:3px;font-family:var(--font-pixel);font-weight:700;}
.lr-go{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--ink-50);font-family:var(--font-pixel);}

/* ==========================================================================
   页面 2 · 经营页
   ========================================================================== */
#view-cook{background:
  linear-gradient(180deg, rgba(255,209,102,.20), rgba(255,209,102,0) 40%),
  var(--cream);}
.cust-band{
  flex:0 0 auto;
  display:flex;align-items:flex-end;justify-content:center;
  gap:7px;padding:8px 10px 4px;
  min-height:132px;
}
.cust-hint{
  align-self:center;padding-top:42px;
  font-size:12px;color:var(--ink-30);letter-spacing:.1em;
}
.cust{
  position:relative;
  flex:1 1 0;max-width:118px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:transform .3s var(--ease),opacity .3s;
}
.cust.is-sel .cust-sprite{border-color:var(--tomato);box-shadow:0 3px 0 var(--tomato);}
.cust.is-lost{opacity:.35;filter:grayscale(1);}
.cust.is-leaving{animation:custLeave .6s var(--ease) forwards;}
@keyframes custLeave{
  0%{transform:translateX(0);opacity:1}
  30%{transform:translateX(0) scale(1.06)}
  100%{transform:translateX(70px);opacity:0}
}
.cust-sprite{
  width:48px;height:72px;
  border:2px solid var(--brown);border-radius:12px;
  background:var(--cream);
  box-shadow:0 3px 0 var(--ink-16);
  transition:border-color .2s,box-shadow .2s;
}
.cust.is-angry .cust-sprite{background:rgba(239,71,111,.16);}
.cust-bubble{
  position:relative;
  display:flex;align-items:center;gap:4px;
  padding:4px 7px;min-height:26px;
  background:var(--cream);
  border:2px solid var(--brown);border-radius:11px;
  box-shadow:0 2px 0 var(--ink-16);
  white-space:nowrap;
}
.cust-bubble::after{
  content:"";position:absolute;left:50%;bottom:-5px;
  width:8px;height:8px;margin-left:-5px;
  background:var(--cream);
  border-right:2px solid var(--brown);border-bottom:2px solid var(--brown);
  transform:rotate(45deg);
}
.cust-bubble .cb-ico{
  width:16px;height:16px;flex:0 0 auto;
}
.cust-bubble .cb-name{font-size:10.5px;font-weight:800;}
.cust-wait{
  position:relative;width:100%;height:7px;
  background:var(--ink-08);border:2px solid var(--brown);border-radius:999px;overflow:hidden;
}
.cust-wait > i{display:block;height:100%;width:100%;background:var(--mint);transition:width .18s linear;}
.cust-wait.is-low > i{background:var(--tomato);}
.cust-wait.is-low{animation:shake .5s var(--ease) infinite;}
.cust-flag{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-size:16px;opacity:0;transition:opacity .2s;
}
.cust.is-angry .cust-flag{opacity:1;}
.cust-tip{
  position:absolute;top:-2px;left:50%;transform:translateX(-50%);
  font-family:var(--font-pixel);font-size:11px;font-weight:700;
  color:var(--tomato);pointer-events:none;opacity:0;
}
.cust-tip.is-on{animation:tipUp .8s var(--ease) forwards;}
@keyframes tipUp{
  0%{opacity:0;transform:translate(-50%,4px)}
  20%{opacity:1;transform:translate(-50%,-4px)}
  100%{opacity:0;transform:translate(-50%,-26px)}
}

.stage-wrap{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;}
#scene{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
.fly-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;}
.fly-coin{
  position:absolute;font-size:18px;line-height:1;
  will-change:transform,opacity;
}
.stage-toast{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.7);
  font-family:var(--font-pixel);font-size:20px;font-weight:700;
  color:var(--yellow);opacity:0;pointer-events:none;z-index:5;white-space:nowrap;
}
.stage-toast.is-on{animation:toastPop 1s var(--ease);}
@keyframes toastPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-64%) scale(1)}
}
.drag-ghost{
  position:absolute;z-index:6;pointer-events:none;
  will-change:transform;
}
.drag-ghost canvas{width:32px;height:32px;}

.pantry-band{
  flex:0 0 auto;
  display:flex;align-items:center;gap:7px;
  padding:8px 10px;
  background:var(--cream);
  border-top:var(--bd) solid var(--brown);
  overflow-x:auto;overflow-y:hidden;
  min-height:64px;
}
.pantry-btn{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:60px;height:52px;
  background:var(--cream);
  border:2px solid var(--brown);border-radius:13px;
  box-shadow:0 3px 0 var(--ink-16);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease);
}
.pantry-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink-16);}
.pantry-btn canvas{width:32px;height:32px;}
.pantry-btn .pb-name{
  font-size:10px;font-weight:700;color:var(--ink-70);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pantry-btn.is-done{background:rgba(6,214,160,.16);border-color:var(--mint);}
.pantry-btn.is-done .pb-name{color:var(--mint);}
.pantry-btn.is-target{animation:pantryPulse 1.1s var(--ease) infinite;}
@keyframes pantryPulse{0%,100%{box-shadow:0 3px 0 var(--ink-16)}50%{box-shadow:0 3px 0 var(--ink-16),0 0 0 4px rgba(255,209,102,.55)}}
.pantry-hint{
  flex:1 1 auto;text-align:center;font-size:11px;color:var(--ink-30);
  letter-spacing:.06em;padding:0 6px;
}

.cook-foot{
  flex:0 0 auto;
  display:flex;align-items:center;gap:9px;
  padding:9px 10px calc(9px + var(--safe-b));
  background:var(--cream);
  border-top:var(--bd) solid var(--brown);
}
.order-card{
  flex:1 1 auto;min-width:0;
  display:flex;align-items:center;gap:9px;
  padding:7px 10px;
  background:var(--cream);
  border:2px solid var(--brown);border-radius:14px;
  box-shadow:0 3px 0 var(--ink-16);
  min-height:50px;
}
.order-card.is-empty{color:var(--ink-30);font-size:12px;justify-content:center;}
.order-card canvas{width:32px;height:32px;flex:0 0 auto;}
.oc-body{min-width:0;flex:1 1 auto;}
.oc-name{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.oc-steps{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}
.oc-step{
  font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:6px;
  background:var(--ink-08);color:var(--ink-50);
  transition:background .2s,color .2s;
}
.oc-step.is-done{background:var(--mint);color:var(--brown);}
.oc-price{
  flex:0 0 auto;font-family:var(--font-pixel);font-size:12px;font-weight:700;
  color:var(--tomato);text-align:right;
}
.tools{flex:0 0 auto;display:flex;gap:6px;}
.tool-btn{
  position:relative;
  width:48px;height:48px;
  display:flex;align-items:center;justify-content:center;
  background:var(--yellow);
  border:2px solid var(--brown);border-radius:14px;
  font-size:20px;line-height:1;
  box-shadow:0 3px 0 var(--brown);
  transition:transform .12s var(--ease),box-shadow .12s var(--ease);
}
.tool-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--brown);}
.tool-btn .tt-cd{
  position:absolute;inset:-2px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(61,43,31,.72);color:var(--cream);
  border-radius:14px;font-family:var(--font-pixel);font-size:12px;font-weight:700;
  opacity:0;transition:opacity .2s;
}
.tool-btn.is-cd .tt-cd{opacity:1;}

/* 暂停 / 结算弹层 */
.overlay{
  position:absolute;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background:rgba(61,43,31,.55);
  opacity:0;visibility:hidden;transition:opacity .22s,visibility .22s;
}
.overlay.is-on{opacity:1;visibility:visible;}
.overlay-box{
  width:100%;max-width:300px;
  padding:20px 18px;
  background:var(--cream);border:var(--bd) solid var(--brown);
  border-radius:20px;box-shadow:0 6px 0 var(--ink-30);
  text-align:center;
}
.overlay-box h3{font-size:17px;margin-bottom:8px;}
.overlay-box p{font-size:12.5px;color:var(--ink-70);line-height:1.6;}
.overlay-actions{display:flex;flex-direction:column;gap:9px;margin-top:16px;}

/* ==========================================================================
   页面 3 · 结算
   ========================================================================== */
#view-result{background:
  radial-gradient(circle at 50% 12%, rgba(255,209,102,.34), transparent 58%),
  var(--cream);}
.res-stars{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:16px 0 6px;font-size:44px;line-height:1;
}
.res-stars .rs{
  color:var(--ink-16);
  opacity:0;transform:scale(.4) rotate(-30deg);
}
.res-stars .rs.on{color:var(--yellow);text-shadow:0 4px 0 rgba(61,43,31,.28);}
.res-stars .rs.show{animation:starIn .55s var(--ease) forwards;}
@keyframes starIn{
  0%{opacity:0;transform:scale(.4) rotate(-30deg)}
  60%{opacity:1;transform:scale(1.32) rotate(8deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
.res-title{text-align:center;font-size:16px;font-weight:800;}
.res-sub{text-align:center;font-size:11.5px;color:var(--ink-70);margin-top:4px;}
.res-conds{
  margin-top:16px;padding:4px 12px;
  border:var(--bd) solid var(--brown);border-radius:var(--r-card);
  background:var(--cream);box-shadow:var(--shadow-card);
}
.res-cond{
  display:flex;align-items:center;gap:9px;
  padding:11px 0;border-bottom:2px dashed var(--ink-16);
}
.res-cond:last-child{border-bottom:0;}
.res-cond .rcn-mark{
  flex:0 0 auto;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:13px;font-weight:700;
  background:var(--mint);color:var(--brown);
}
.res-cond.is-fail .rcn-mark{background:rgba(239,71,111,.18);color:var(--tomato);}
.res-cond .rcn-txt{flex:1 1 auto;font-size:12.5px;font-weight:700;}
.res-cond .rcn-val{font-family:var(--font-pixel);font-size:11.5px;font-weight:700;color:var(--ink-50);}
.res-cond.is-ok .rcn-val{color:var(--mint);}
.res-cond.is-fail .rcn-val{color:var(--tomato);}
.res-money{
  display:flex;gap:10px;margin-top:14px;
}
.money-box{
  flex:1 1 0;padding:11px;text-align:center;
  border:var(--bd) solid var(--brown);border-radius:16px;
  background:var(--cream);box-shadow:var(--shadow-card);
}
.money-box .mb-val{font-family:var(--font-pixel);font-size:17px;font-weight:700;margin-top:2px;}
.money-box .mb-lab{font-size:10.5px;color:var(--ink-70);}
.money-box.is-coin{background:var(--yellow);}
.money-box.is-tip{background:rgba(6,214,160,.2);}
.res-exp{
  margin-top:14px;padding:12px 14px;
  border:var(--bd) solid var(--brown);border-radius:16px;
  background:var(--cream);box-shadow:var(--shadow-card);
}
.res-exp-top{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;}
.res-exp-top b{font-family:var(--font-pixel);font-size:12.5px;}
.exp-track{
  position:relative;height:12px;margin-top:8px;
  background:var(--ink-08);border:2px solid var(--brown);border-radius:999px;overflow:hidden;
}
.exp-track > i{display:block;height:100%;background:var(--yellow);transition:width .6s var(--ease);}
.res-unlock{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
.unlock-item{
  display:flex;align-items:center;gap:9px;
  padding:10px 13px;
  background:var(--mint);border:var(--bd) solid var(--brown);
  border-radius:14px;box-shadow:var(--shadow-card);
  font-size:12.5px;font-weight:800;
  animation:unlockIn .5s var(--ease) both;
}
@keyframes unlockIn{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:none}}
.unlock-item .ul-ico{font-size:17px;}
.res-actions{display:flex;flex-direction:column;gap:9px;margin-top:20px;padding-bottom:8px;}
.res-actions .row2{display:flex;gap:9px;}
.res-actions .row2 .btn{flex:1 1 0;}

/* ==========================================================================
   页面 4 · 升级弹窗
   ========================================================================== */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;}
.modal[hidden]{display:none;}
.modal-mask{position:absolute;inset:0;background:rgba(61,43,31,.55);animation:fadeIn .2s both;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  position:relative;
  width:100%;max-width:440px;
  max-height:84vh;
  display:flex;flex-direction:column;
  background:var(--cream);
  border:var(--bd) solid var(--brown);
  border-bottom:0;
  border-radius:24px 24px 0 0;
  padding-bottom:var(--safe-b);
  animation:sheetUp .3s var(--ease) both;
  overflow:hidden;
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@media (min-width:480px){
  .modal{align-items:center;padding:20px;}
  .modal-box{max-width:420px;border-radius:22px;border-bottom:var(--bd) solid var(--brown);max-height:78vh;}
}
.modal-head{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:14px 14px 11px;border-bottom:2px solid var(--ink-16);
}
.modal-head h3{flex:1 1 auto;font-size:15px;}
.modal-head .mh-sub{font-size:11px;color:var(--ink-70);font-family:var(--font-pixel);font-weight:700;}
.x{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--brown);border-radius:11px;background:var(--cream);
  font-size:14px;box-shadow:0 2px 0 var(--brown);
}
.x:active{transform:translateY(2px);box-shadow:none;}

.tabs{
  flex:0 0 auto;display:flex;gap:0;
  padding:10px 12px 0;
  overflow-x:auto;overflow-y:hidden;
}
.tabs.is-bordered{border-bottom:2px solid var(--ink-16);padding-bottom:0;}
.tab{
  flex:0 0 auto;
  padding:9px 14px 11px;
  font-size:12.5px;font-weight:700;color:var(--ink-50);
  border-bottom:3px solid transparent;
  white-space:nowrap;
  transition:color .2s,border-color .2s;
}
.tab.is-active{color:var(--brown);border-bottom-color:var(--tomato);}
.tab .tab-num{
  display:inline-block;margin-left:4px;font-family:var(--font-pixel);font-size:9.5px;
  background:var(--tomato);color:var(--cream);border-radius:999px;padding:1px 5px;vertical-align:1px;
}

.up-list{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 14px 20px;display:flex;flex-direction:column;gap:10px;}
.up-row{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;
  border:2px solid var(--brown);border-radius:16px;
  background:var(--cream);box-shadow:0 3px 0 var(--ink-16);
}
.up-ico{
  flex:0 0 auto;width:42px;height:42px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--brown);border-radius:12px;background:var(--yellow);font-size:20px;
}
.up-body{flex:1 1 auto;min-width:0;}
.up-name{display:flex;align-items:baseline;gap:6px;font-size:13.5px;font-weight:800;}
.up-lv{font-family:var(--font-pixel);font-size:10px;font-weight:700;color:var(--ink-50);}
.up-desc{font-size:11px;color:var(--ink-70);margin-top:3px;line-height:1.45;}
.up-dots{display:flex;gap:3px;margin-top:5px;}
.up-dots i{width:12px;height:5px;border-radius:2px;background:var(--ink-16);}
.up-dots i.on{background:var(--mint);}
.up-act{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:5px;}

/* ==========================================================================
   页面 5 · 图鉴 / 成就 / 每日任务
   ========================================================================== */
.tab-panel{display:none;}
.tab-panel.is-active{display:block;animation:panelIn .28s var(--ease);}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-title{
  display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:800;margin:16px 0 9px;
}
.sec-title:first-child{margin-top:2px;}
.sec-title .st-line{flex:1 1 auto;height:2px;background:var(--ink-16);border-radius:2px;}
.sec-title .st-num{font-family:var(--font-pixel);font-size:10.5px;color:var(--ink-50);}

.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px;}
.book-cell{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 6px;
  border:2px solid var(--brown);border-radius:15px;
  background:var(--cream);box-shadow:0 3px 0 var(--ink-16);
}
.book-cell.is-locked{background:var(--ink-04);}
.book-cell canvas{width:32px;height:32px;}
.book-cell.is-locked canvas{filter:grayscale(1) opacity(.3);}
.book-cell .bc-name{font-size:11px;font-weight:800;text-align:center;line-height:1.3;}
.book-cell .bc-sub{font-size:9.5px;color:var(--ink-50);font-family:var(--font-pixel);font-weight:700;}
.book-cell.is-locked .bc-name{color:var(--ink-30);}
/* 特殊顾客（第六优先级）：金色边框独立标注。
   现在数据里还没有 special 顾客，所以不会有金框；等那边做出来会自动生效。 */
.book-cell.is-special{
  border-color:#E0A100;
  background:rgba(255,209,102,.24);
  box-shadow:0 3px 0 rgba(224,161,0,.35);
}
.book-cell.is-special .bc-name{color:#9A6B00;}

.postcard-list{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.postcard{
  position:relative;overflow:hidden;
  border:2px solid var(--brown);border-radius:15px;
  background:var(--cream);box-shadow:0 3px 0 var(--ink-16);
  padding:10px;display:flex;flex-direction:column;gap:5px;
}
.postcard.is-locked{background:var(--ink-04);}
.pc-scene{
  height:56px;border-radius:10px;border:2px solid var(--brown);
  display:flex;align-items:center;justify-content:center;font-size:24px;
}
.postcard.is-locked .pc-scene{filter:grayscale(1) opacity(.4);}
.pc-name{font-size:11.5px;font-weight:800;}
.pc-sub{font-size:9.5px;color:var(--ink-50);font-family:var(--font-pixel);font-weight:700;}
.postcard.is-locked .pc-name{color:var(--ink-30);}

/* -------- 图鉴的二级标签：菜谱 / 顾客 / 徽章 / 明信片 --------
   一级标签（图鉴/成就/每日任务）控制"哪一页"，二级标签控制"图鉴里的哪一类"。
   二级标签只在「图鉴」这一类下出现，所以用 #view-codex[data-codex-tab="book"] 控制显隐。 */
.sub-tabs{
  flex:0 0 auto;display:none;gap:6px;
  padding:9px 12px 10px;
  border-bottom:2px solid var(--ink-16);
}
#view-codex[data-codex-tab="book"] .sub-tabs{display:grid;grid-template-columns:repeat(4,1fr);}
.sub-tab{
  padding:7px 4px;border:2px solid var(--brown);border-radius:999px;
  background:var(--ink-04);color:var(--ink-70);
  font-family:var(--font-pixel);font-size:10.5px;font-weight:700;
  box-shadow:0 2px 0 var(--ink-16);
  transition:transform .12s var(--ease),background .15s,color .15s;
}
.sub-tab.is-active{background:var(--yellow);color:var(--brown);transform:translateY(-1px);}
.sub-tab:active{transform:translateY(1px);}
/* 二级面板：同一时刻只显示一个，避免"整页堆叠滚动" */
.sub-panel{display:none;}
.sub-panel.is-active{display:block;animation:panelIn .28s var(--ease);}

/* -------- 徽章墙（普通徽章纯收藏） -------- */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.badge-cell{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:11px 8px;background:var(--cream);
  border:2px solid var(--brown);border-radius:15px;text-align:center;
}
.badge-cell.is-got{background:rgba(255,209,102,.30);box-shadow:0 3px 0 var(--ink-16);}
.badge-cell.is-locked,.badge-cell.is-soon{background:var(--ink-04);border-color:var(--ink-16);}
.badge-ico{font-size:26px;line-height:1;}
.badge-cell.is-locked .badge-ico,.badge-cell.is-soon .badge-ico{filter:grayscale(1) opacity(.40);}
.badge-name{font-size:11px;font-weight:800;line-height:1.3;}
.badge-cell.is-locked .badge-name,.badge-cell.is-soon .badge-name{color:var(--ink-50);}
.badge-sub{font-size:9px;font-family:var(--font-pixel);font-weight:700;color:var(--ink-50);line-height:1.4;}

.ach-list{display:flex;flex-direction:column;gap:9px;}
.ach-row{
  display:flex;align-items:center;gap:11px;
  padding:11px 12px;
  border:2px solid var(--brown);border-radius:16px;
  background:var(--cream);box-shadow:0 3px 0 var(--ink-16);
}
.ach-row.is-done{background:rgba(6,214,160,.14);}
.ach-ico{
  flex:0 0 auto;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--brown);border-radius:12px;background:var(--cream);font-size:19px;
}
.ach-row.is-done .ach-ico{background:var(--mint);}
.ach-body{flex:1 1 auto;min-width:0;}
.ach-name{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;}
.ach-desc{font-size:10.5px;color:var(--ink-70);margin-top:3px;}
.ach-bar{
  position:relative;height:8px;margin-top:6px;
  background:var(--ink-08);border:1.5px solid var(--brown);border-radius:999px;overflow:hidden;
}
.ach-bar > i{display:block;height:100%;background:var(--yellow);}
.ach-val{flex:0 0 auto;font-family:var(--font-pixel);font-size:10px;font-weight:700;color:var(--ink-50);}

.daily-head{
  display:flex;align-items:center;gap:10px;padding:12px 13px;margin-bottom:12px;
  border:var(--bd) solid var(--brown);border-radius:16px;
  background:var(--yellow);box-shadow:var(--shadow-card);
}
.daily-head .dh-ico{font-size:24px;}
.daily-head .dh-body{flex:1 1 auto;}
.daily-head .dh-title{font-size:14px;font-weight:800;}
.daily-head .dh-sub{font-size:10.5px;color:var(--ink-70);margin-top:3px;}
.daily-list{display:flex;flex-direction:column;gap:10px;}
.daily-row{
  display:flex;align-items:center;gap:11px;padding:12px;
  border:2px solid var(--brown);border-radius:16px;
  background:var(--cream);box-shadow:0 3px 0 var(--ink-16);
}
.daily-row.is-done{background:rgba(6,214,160,.13);}
.daily-row.is-claimed{opacity:.6;}
.dr-body{flex:1 1 auto;min-width:0;}
.dr-name{font-size:13px;font-weight:800;}
.dr-sub{font-size:10.5px;color:var(--ink-70);margin-top:3px;font-family:var(--font-pixel);font-weight:700;}
.dr-reward{
  display:inline-flex;align-items:center;gap:3px;
  font-family:var(--font-pixel);font-size:10.5px;font-weight:700;
  background:var(--ink-08);border-radius:7px;padding:2px 6px;margin-top:5px;
}

/* ==========================================================================
   阶段 3 补丁：经营页立绘 / 拖拽 / 升级按钮 的少量补充样式
   ========================================================================== */
/* 顾客立绘：外框 52×76（内含 48×72 画布，正好 16×24 × scale3，像素不被拉花） */
.cust-sprite{
  width:52px;height:76px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.cust.is-hover .cust-sprite{border-color:var(--mint);box-shadow:0 3px 0 var(--mint);}
.cust-name{
  font-size:10px;font-weight:800;color:var(--ink-70);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.cust-tip{white-space:nowrap;}
.toast.is-red{background:var(--tomato);color:var(--cream);}
.up-buy{min-height:36px;font-size:12.5px;padding:0 12px;border-radius:12px;box-shadow:0 3px 0 var(--brown);}
.up-buy[aria-disabled="true"]{opacity:.45;pointer-events:none;}
.res-cond .rcn-txt small{display:block;font-weight:700;color:var(--ink-50);font-size:10px;margin-top:2px;}

/* ==========================================================================
   底部导航
   ========================================================================== */
#bottomnav{
  flex:0 0 auto;
  display:flex;align-items:center;gap:6px;
  padding:8px 10px calc(8px + var(--safe-b));
  background:var(--cream);
  border-top:var(--bd) solid var(--brown);
  z-index:6;
}
#bottomnav[hidden]{display:none;}
.nav-btn{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:56px;height:52px;
  border-radius:14px;
  color:var(--ink-70);
  transition:background .2s,color .2s,transform .12s var(--ease);
}
.nav-btn:active{transform:translateY(2px);}
.nav-btn .nb-ico{font-size:19px;line-height:1;}
.nav-btn .nb-txt{font-size:10px;font-weight:700;}
.nav-btn.is-active{background:var(--ink-08);color:var(--brown);}
.nav-primary{flex:1 1 auto;margin-left:2px;}

/* ==========================================================================
   全局动效层 / 提示
   ========================================================================== */
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden;}
.fx-coin{
  position:absolute;font-size:20px;line-height:1;
  will-change:transform,opacity;
}
.fx-star{
  position:absolute;width:10px;height:10px;
  background:var(--yellow);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  will-change:transform,opacity;
}
.fx-confetti{
  position:absolute;width:8px;height:12px;border-radius:2px;
  will-change:transform,opacity;
}
.fx-plane{
  position:absolute;font-size:30px;line-height:1;
  will-change:transform;
}
.fx-penguin{
  position:fixed;left:50%;bottom:26%;transform:translate(-50%,40px) scale(.6);
  font-size:52px;opacity:0;z-index:62;pointer-events:none;
}
.fx-penguin.is-on{animation:penguinIn 2.4s var(--ease) forwards;}
@keyframes penguinIn{
  0%{opacity:0;transform:translate(-50%,60px) scale(.5)}
  18%{opacity:1;transform:translate(-50%,0) scale(1.12)}
  26%{transform:translate(-50%,-6px) scale(1) rotate(-8deg)}
  38%{transform:translate(-50%,-6px) scale(1) rotate(8deg)}
  50%{transform:translate(-50%,-6px) scale(1) rotate(-8deg)}
  70%{opacity:1;transform:translate(-50%,-6px) scale(1)}
  100%{opacity:0;transform:translate(-50%,20px) scale(.7)}
}
.fx-flash{
  position:fixed;inset:0;background:#fff;opacity:0;z-index:58;pointer-events:none;
}
.fx-flash.is-on{animation:flashOut .22s ease-out;}
@keyframes flashOut{0%{opacity:.85}100%{opacity:0}}

#toastHost{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));
  transform:translateX(-50%);
  z-index:70;display:flex;flex-direction:column;align-items:center;gap:7px;
  pointer-events:none;width:max-content;max-width:88vw;
}
.toast{
  padding:9px 15px;
  background:var(--brown);color:var(--cream);
  border-radius:999px;
  font-size:12.5px;font-weight:700;
  box-shadow:0 4px 0 rgba(0,0,0,.2);
  animation:toastIn .3s var(--ease) both, toastOut .32s ease-in 2.1s both;
  max-width:88vw;text-align:center;
}
.toast.is-gold{background:var(--yellow);color:var(--brown);}
.toast.is-mint{background:var(--mint);color:var(--brown);}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.92)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-8px) scale(.96)}}

#dialogHost{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:22px;}
#dialogHost.is-on{display:flex;}
.dialog-mask{position:absolute;inset:0;background:rgba(61,43,31,.58);}
.dialog-box{
  position:relative;width:100%;max-width:310px;padding:20px 18px;
  background:var(--cream);border:var(--bd) solid var(--brown);border-radius:20px;
  box-shadow:0 6px 0 var(--ink-30);text-align:center;
  animation:dlgIn .26s var(--ease) both;
}
@keyframes dlgIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.dialog-box h4{font-size:16px;font-weight:800;margin-bottom:8px;}
.dialog-box p{font-size:12.5px;color:var(--ink-70);line-height:1.62;}
.dialog-actions{display:flex;gap:9px;margin-top:17px;}
.dialog-actions .btn{flex:1 1 0;}

/* 加载 */
#boot{
  position:fixed;inset:0;z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:var(--cream);
  transition:opacity .35s ease,visibility .35s;
}
#boot.is-off{opacity:0;visibility:hidden;}
.boot-logo{font-size:22px;color:var(--yellow);text-align:center;}
.boot-sub{font-size:11px;color:var(--ink-50);letter-spacing:.22em;}
.boot-bar{width:150px;height:10px;background:var(--ink-08);border:2px solid var(--brown);border-radius:999px;overflow:hidden;}
.boot-bar > i{display:block;height:100%;width:36%;background:var(--tomato);animation:bootSlide 1.1s ease-in-out infinite;}
@keyframes bootSlide{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* 无障碍 / 降级 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}

<script>
/* ==========================================================================
   Travel Chefs / 旅行大厨  —— 全部逻辑内联（单文件交付）
   命名空间：window.TC
   架构红线：游戏规则只写在纯逻辑模块（DATA / Calc / Save / Level / Upgrade /
             Daily / Easter），Scene 与 UI 只负责渲染与把操作翻译成逻辑调用。
   ========================================================================== */
window.TC = window.TC || {};
var TC = window.TC;
TC.VERSION = '2.1.2';
TC.bootError = null;

/* --------------------------------------------------------------------------
   模块：TC.Util —— 通用工具
   -------------------------------------------------------------------------- */
(function (TC) {
  'use strict';
  var U = {};

  U.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
  U.lerp = function (a, b, t) { return a + (b - a) * t; };

  /** 确定性伪随机：同一种子必然产出同一序列（供每日任务 / 顾客生成复现） */
  U.hashSeed = function (str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < String(str).length; i++) {
      h ^= String(str).charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  };
  U.mulberry32 = function (seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  /** 用日期字符串生成稳定随机数发生器 */
  U.seededBy = function (str) { return U.mulberry32(U.hashSeed(str)); };

  /** 带权随机；rand 可注入以便测试 */
  U.pickWeighted = function (list, weightKey, rand) {
    rand = rand || Math.random;
    var total = 0, i;
    for (i = 0; i < list.length; i++) total += (list[i][weightKey] || 0);
    if (total <= 0) return list[0] || null;
    var r = rand() * total;
    for (i = 0; i < list.length; i++) {
      r -= (list[i][weightKey] || 0);
      if (r <= 0) return list[i];
    }
    return list[list.length - 1];
  };

  U.pick = function (list, rand) {
    rand = rand || Math.random;
    return list[Math.floor(rand() * list.length)] || null;
  };

  /** 无放回抽 n 个（用 Fisher-Yates + 注入随机） */
  U.sample = function (list, n, rand) {
    var arr = list.slice(), out = [], i;
    for (i = 0; i < n && arr.length; i++) {
      var k = Math.floor((rand || Math.random)() * arr.length);
      out.push(arr.splice(k, 1)[0]);
    }
    return out;
  };

  U.sum = function (list, fn) {
    var t = 0;
    for (var i = 0; i < list.length; i++) t += fn ? fn(list[i], i) : list[i];
    return t;
  };

  /** 秒 → mm:ss */
  U.mmss = function (sec) {
    sec = Math.max(0, Math.ceil(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  };

  /** 本地日期 YYYY-MM-DD */
  U.today = function (d) {
    d = d || new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  };

  U.deepClone = function (o) { return JSON.parse(JSON.stringify(o)); };

  /** 浅合并（后面的来源覆盖前面的），支持 2 个以上来源 */
  U.assign = function (target) {
    for (var i = 1; i < arguments.length; i++) {
      var src = arguments[i];
      if (!src) continue;
      for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) target[k] = src[k];
    }
    return target;
  };

  /** 按 id 建索引 */
  U.indexBy = function (list, key) {
    var map = {};
    for (var i = 0; i < list.length; i++) map[list[i][key]] = list[i];
    return map;
  };

  TC.Util = U;
})(TC);

  /* ------------------------------ 徽章 ------------------------------ */
  /**

      pot: pot,

    });
    var pool = D.CUSTOMERS.filter(function (c) { return !present[c.id]; });
    if (!pool.length) pool = D.CUSTOMERS.slice();

  function spawnCustomer(run, events) {
    var type = pickCustomerType(run);
    if (!type) return null;
    var dishId = U.pick(run.level.dishPool, run.rand);
    var max = C.patience(type.id, run.levelId);
    var c = {
      uid: 'c' + (run.customers.length + 1) + '_' + Math.floor(run.rand() * 100000),
      id: type.id,
      name: type.name,
      sprite: type.sprite,
      dishId: dishId,
      patienceMax: max,
      patienceLeft: max,
      state: 'waiting',

    run.runtime += dtMs;
    run.timeLeft -= dtMs;

    /* 道具冷却 */
    for (var k in run.toolCd) {
      if (run.toolCd[k] > 0) run.toolCd[k] = Math.max(0, run.toolCd[k] - dtMs);
    }

    /* 顾客耐心 */
    for (var i = 0; i < run.customers.length; i++) {
      var c = run.customers[i];

      if (c.patienceLeft <= 0) {

    if (pot.state !== 'ready') return { ok: false, reason: 'not-ready' };

    if (!waiting.length) return { ok: false, reason: 'no-customer' };
    for (var i = 0; i < run.plates.length; i++) {
      var match = waiting.filter(function (c) { return c.dishId === run.plates[i].dishId; })[0];
      if (match) {

      }

  };

  /* ------------------------- 道具 ------------------------- */
  L.toolCdLeft = function (run, toolId) { return run.toolCd[toolId] || 0; };

    if (!tool) return { ok: false, reason: 'no-such-tool' };
    if ((run.toolCd[toolId] || 0) > 0) return { ok: false, reason: 'cooldown', left: run.toolCd[toolId] };

    if (toolId === 'speed') {
      var cooking = run.pots.map(function (p, i) { return { p: p, i: i }; })
        .filter(function (x) { return x.p && x.p.state === 'cooking'; })
        .sort(function (a, b) { return b.p.cookLeft - a.p.cookLeft; })[0];
      if (!cooking) return { ok: false, reason: 'no-cooking' };
      cooking.p.cookLeft = Math.max(0, cooking.p.cookLeft * 0.5);
      run.toolCd.speed = tool.cd * 1000;
      return { ok: true, tool: toolId, potIdx: cooking.i, cookLeft: cooking.p.cookLeft };
    }

      var add = urgent.patienceMax * 0.5;
      urgent.patienceLeft = Math.min(urgent.patienceMax, urgent.patienceLeft + add);

      return { ok: true, tool: toolId, customer: urgent, patienceLeft: urgent.patienceLeft };

      r.tool = toolId;
      return r;
    }
    return { ok: false, reason: 'no-such-tool' };
  };

   * @returns {object} settle + { expInfo, newAchievements, unlockedLevelId, unlockedDishIds, unlockedRegionIds, levelState }
   */
  L.finish = function (save, run) {
    var firstClear = C.levelStars(save, run.levelId) === 0;
    var beforeRegions = C.unlockedRegionIds(save);
    var beforeDishes = C.unlockedDishIds(save);

    var settle = C.settle({ levelId: run.levelId, save: save, run: run, firstClear: firstClear });

    if (settle.totalGain) S.addCoins(save, settle.totalGain);
    var expInfo = S.addExp(save, settle.exp);
    if (settle.cleared) S.setLevelStars(save, run.levelId, settle.stars);
    S.recordRun(save, run, settle, { customerIds: Object.keys(run.encounterIds) });

    var unlockedLevelId = null;
    if (settle.unlockLevelId && C.isLevelUnlocked(save, settle.unlockLevelId)) {
      unlockedLevelId = settle.unlockLevelId;
    }

    var afterRegions = C.unlockedRegionIds(save);
    var afterDishes = C.unlockedDishIds(save);

    run.settled = settle;

      newAchievements: newAchievements,
      unlockedLevelId: unlockedLevelId,
      unlockedDishIds: afterDishes.filter(function (d) { return beforeDishes.indexOf(d) === -1; }),
      unlockedRegionIds: afterRegions.filter(function (r) { return beforeRegions.indexOf(r) === -1; }),

    return L.finish(save, run);
  };

  L.PLATE_CAP = PLATE_CAP;
  TC.Level = L;
})(TC);

/* --------------------------------------------------------------------------
   模块：TC.Daily —— 每日任务（按日期取种子，同一天必然抽出同样 3 条）
   -------------------------------------------------------------------------- */
(function (TC) {
  'use strict';
  var D = TC.DATA, U = TC.Util;
  var Y = {};

  /** 用日期串生成稳定随机数发生器，供测试复现 */
  Y.randFor = function (dateStr) { return U.seededBy('tc-daily-' + dateStr); };

  /** 该日期抽中的任务 id 列表（确定性） */
  Y.idsFor = function (dateStr) {
    var rand = Y.randFor(dateStr);
    return U.sample(D.DAILY_POOL, D.DAILY_COUNT, rand).map(function (t) { return t.id; });
  };

  /** 该日期的任务列表（存档里存的就是这个形状） */
  Y.tasksFor = function (dateStr) {
    return Y.idsFor(dateStr).map(function (id) { return { id: id }; });
  };

  Y.metricKeyOf = function (task) {
    return task && task.metric ? task.metric : null;
  };

  /** 当前进度 */
  Y.progressOf = function (save, task) {
    if (!task) return 0;
    var m = (save && save.daily && save.daily.metrics) || {};
    return m[task.metric] || 0;
  };

  /**
   * 任务页每一行的完整数据
   * @returns {Array<{id,task,cur,target,done,claimed,canClaim,pct,rewardText}>}
   */
  Y.rows = function (save) {
    var list = (save && save.daily && save.daily.tasks) || [];
    var claimed = (save && save.daily && save.daily.claimed) || [];
    return list.map(function (t) {
      var task = D.task(t.id);
      if (!task) return null;
      var cur = Math.min(Y.progressOf(save, task), task.target);
      var done = Y.progressOf(save, task) >= task.target;
      var isClaimed = claimed.indexOf(task.id) !== -1;
      return {
        id: task.id,
        task: task,
        name: task.name,
        cur: cur,
        target: task.target,
        done: done,
        claimed: isClaimed,
        canClaim: done && !isClaimed,
        pct: task.target ? Math.min(1, cur / task.target) : 0,

    }).filter(Boolean);

  Y.claimableCount = function (save) {

  };

    return Y.rows(save).filter(function (r) { return r.done; }).length;

   彩蛋 1 地图地球仪 ×10 → 小飞机 + 金币雨 +50
          ★ 每个自然日最多触发 1 次；跨天计数自动重置，今天已触发则锁住
   彩蛋 2 单局连续 5 次 Perfect → 彩虹糖

   * 跨天结算：日期一变就把「今日点击计数」清零，于是每天都能重新攒 10 次。
   * 注意有副作用（和 S.checkDaily 同一套路）：渲染/取状态前调一次即可。
   * @returns {boolean} 本次是否真的发生了跨天重置
   */
  E.globeRollover = function (save, today) {
    var e = E.ensure(save), d = dayOf(today);
    if (e.globeDay === d) return false;
    e.globeDay = d;
    e.globe = 0;
    return true;
  };

  /**
   * 地球仪「今日」状态。HUD 与 tapGlobe 共用同一份判定，避免两处规则各写一遍。
   * @returns {{taps,need,locked,firedToday,everFired}}
   */
  E.globeState = function (save, today) {
    var e = E.ensure(save), d = dayOf(today);
    E.globeRollover(save, d);
    var firedToday = e.globeFiredDay === d;
    return {
      taps: firedToday ? 0 : e.globe,          // 今日已飞过 → 角标回到 0
      need: firedToday ? 0 : Math.max(0, E.GLOBE_TAPS - e.globe),
      locked: firedToday,                      // 锁住：今天不再计数、不再发奖
      firedToday: firedToday,
      everFired: !!e.globeFired
    };
  };

  /**
   * 点一次地球仪。
   * 规则：攒满 E.GLOBE_TAPS 次触发；★每个自然日最多触发 1 次★，
   *      跨天后计数从 0 重新开始；今日已触发则返回 locked —— 不计数也不发奖。
   * @param {string} [today] 注入日期（不传取本机今天）
   * @returns {{ok,fired,locked,taps,need,everFired,reward?}}
   */

    if (st.locked) {

    }

    e.globe += 1;
    if (e.globe >= E.GLOBE_TAPS) {
      e.globe = 0;
      e.globeFired = true;                    // 永久：彩蛋猎人 / 彩蛋列表用
      e.globeFiredDay = dayOf(today);         // 每日闸门：今天这份已经用掉了
      TC.Save.award(save, D.EASTER.globe.reward);
      return {
        ok: true, fired: true, locked: true,
        taps: 0, need: E.GLOBE_TAPS,
        reward: D.EASTER.globe.reward, everFired: true
      };
    }
    return {
      ok: false, fired: false, locked: false,

  E.globeFiredToday = function (save, today) {

  /**
   * 每局内判定一次；连续 Perfect 达标即触发，一局只触发一次
   * @returns {boolean} 本次是否新触发
   */
  E.checkRainbow = function (run) {
    if (!run || run.rainbow) return false;
    if ((run.perfectStreak || 0) >= E.RAINBOW_STREAK) {
      run.rainbow = true;
      if (run.save && run.save.easter) run.save.easter.rainbow = true;
      return true;
    }
    return false;
  };

  /**
   * 点一次冰箱；一局最多触发一次
   * @returns {{ok,penguin,taps,need,reward?}}
   */
  E.tapPenguin = function (run) {
    run.fridgeTaps = (run.fridgeTaps || 0) + 1;
    var mod = run.fridgeTaps % E.PENGUIN_TAPS;
    if (run.penguinUsed) {
      return { ok: false, penguin: false, taps: run.fridgeTaps, need: E.PENGUIN_TAPS - mod, used: true };
    }
    if (mod === 0) {
      run.penguinUsed = true;
      if (run.save) {
        E.ensure(run.save).penguin = true;
        TC.Save.award(run.save, D.EASTER.penguin.reward);
      }
      return { ok: true, penguin: true, taps: run.fridgeTaps, need: E.PENGUIN_TAPS, reward: D.EASTER.penguin.reward };
    }
    return { ok: false, penguin: false, taps: run.fridgeTaps, need: E.PENGUIN_TAPS - mod };
  };

  /** 已触发彩蛋个数 */
  E.count = function (save) { return TC.Calc.eggCount(save); };
  E.total = function () { return 3; };

      { id: 'rainbow', name: '彩虹糖雨', icon: '🌈', desc: '单局连续 ' + E.RAINBOW_STREAK + ' 次 Perfect 上菜', done: !!e.rainbow },
      { id: 'penguin', name: '企鹅厨师', icon: '🐧', desc: '在厨房点冰箱 ' + E.PENGUIN_TAPS + ' 次', done: !!e.penguin }
    ];
  };

  TC.Easter = E;
})(TC);

/* --------------------------------------------------------------------------
   模块：TC.Ach —— 成就（进度取数 + 达成判定 + 发奖）
   -------------------------------------------------------------------------- */
(function (TC) {
  'use strict';
  var D = TC.DATA, C = TC.Calc, S = TC.Save, U = TC.Util;
  var A = {};

  /** 成就指标（含每日任务用的今日计数） */
  A.metrics = function (save) { return C.metrics(save); };

  A.valueOf = function (save, achievement) {
    var m = A.metrics(save);
    return m[achievement.metric] || 0;
  };

  A.progress = function (save, id) {
    var a = D.achievement(id);
    if (!a) return { cur: 0, target: 1, done: false, pct: 0 };
    var raw = A.valueOf(save, a);
    var cur = Math.min(raw, a.target);
    return {
      cur: cur, raw: raw, target: a.target,
      done: !!save.achievements[id],
      pct: a.target ? Math.min(1, cur / a.target) : 0
    };
  };

  /** 成就页每一行的完整数据 */
  A.rows = function (save) {
    return D.ACHIEVEMENTS.map(function (a) {
      var p = A.progress(save, a.id);
      return U.assign({}, p, {
        id: a.id, name: a.name, icon: a.icon, desc: a.desc,
        reward: a.reward,
        rewardText: a.reward.gems ? ('💎 ' + a.reward.gems) : ('🪙 ' + (a.reward.coins || 0))
      });
    });
  };

  A.doneCount = function (save) {
    return D.ACHIEVEMENTS.filter(function (a) { return !!save.achievements[a.id]; }).length;
  };
  A.total = function () { return D.ACHIEVEMENTS.length; };

  /**
   * 判定并发放新达成的成就
   * @returns {Array<achievement>} 本次新解锁的
   */
  A.evaluate = function (save, nowIso) {
    var m = A.metrics(save);
    var out = [];
    D.ACHIEVEMENTS.forEach(function (a) {
      if (save.achievements[a.id]) return;
      if ((m[a.metric] || 0) >= a.target) {
        save.achievements[a.id] = nowIso || new Date().toISOString();
        S.award(save, a.reward);
        out.push(a);
      }
    });
    return out;
  };

  TC.Ach = A;
})(TC);

  /* ======================== 轻量动效（阶段 6 再精修） ======================== */
  function spawnFx(cls, text, top, duration, from, to) {
    var host = $('fx');
    if (!host || !host.appendChild) return null;
    var n = document.createElement('div');
    n.className = cls;
    if (text != null) n.textContent = text;
    if (top != null) n.style.top = top;
    host.appendChild(n);
    var kill = function () { if (n.parentNode) n.parentNode.removeChild(n); };
    if (n.animate) {
      n._anim = n.animate(from, to || { duration: duration || 900, easing: 'linear' });
      if (n._anim && n._anim.onfinish !== undefined) n._anim.onfinish = kill;
      else setTimeout(kill, duration || 900);
    } else {
      setTimeout(kill, 0);                   // 无动画能力的环境（如 jsdom）直接回收
    }
    return n;
  }
  UI.spawnFx = spawnFx;

  /** 小飞机从左飞到右 */

    var w = 420;
    var host = $('fx');
    if (host && host.clientWidth) w = host.clientWidth;
    if (host && host.ownerDocument && host.ownerDocument.defaultView && host.ownerDocument.defaultView.innerWidth) {
      w = Math.min(w, host.ownerDocument.defaultView.innerWidth);
    }
    return spawnFx('fx-plane', '✈️', '16%', 1500,
      [{ transform: 'translateX(-70px) translateY(0) rotate(-6deg)' },
       { transform: 'translateX(' + (w + 70) + 'px) translateY(-26px) rotate(-6deg)' }]);
  };

  /* ========================================================================
     页面 2 · 经营（Canvas 厨房 + DOM 卡片）
     本模块只做「渲染 + 把操作翻译成对 TC.Level 的调用」；
     能不能做、做了算几分，全部由 TC.Level / TC.Calc 判定。
     ======================================================================== */

  /** 取 canvas 的 2D 上下文；没有（如 jsdom）就返回 null，调用方静默跳过 */
  function ctxOf(cv) {
    if (!cv || !cv.getContext) return null;
    try { return cv.getContext('2d'); } catch (e) { return null; }
  }
  UI.ctxOf = ctxOf;

  /** 清屏 + 画一组矩形（画不上就返回 0，绝不抛） */
  function paintInto(cv, rects) {
    var ctx = ctxOf(cv);
    if (!ctx) return 0;
    if (ctx.clearRect) ctx.clearRect(0, 0, cv.width, cv.height);
    return P.paintRects(ctx, rects, 0, 0);
  }
  UI.paintInto = paintInto;

  /** 画一个菜品 sprite 到指定 canvas（scale 默认按 canvas 尺寸推：16→canvas/16） */
  function paintDishInto(cv, spriteKey) {
    if (!cv) return 0;
    var s = Math.max(1, Math.round((cv.width || 16) / 16));
    return paintInto(cv, P.rectsOf(spriteKey, s));
  }
  UI.paintDishInto = paintDishInto;

  /** 画一个食材到 canvas 上（art 为空则清空） */
  function paintIngredientInto(cv, art) {
    if (!cv) return 0;
    var s = Math.max(1, Math.round((cv.width || 16) / 16));
    return paintInto(cv, P.ingredientRects(art, s));
  }
  UI.paintIngredientInto = paintIngredientInto;

  /* ------------------------- 顾客带 ------------------------- */
  /**
   * 顾客区域里每位顾客的屏幕矩形（拖拽命中用；纯几何，可单测）
   * @returns {Array<{uid,x,y,w,h}>} 视口坐标
   */
  UI.custRects = function () {
    var host = $('custBand');
    if (!host || !host.querySelectorAll) return [];
    var nodes = host.querySelectorAll('[data-uid]');
    var out = [];
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect ? nodes[i].getBoundingClientRect() : null;
      if (!r) continue;
      out.push({
        uid: nodes[i].getAttribute('data-uid'),
        x: r.left, y: r.top, w: r.width, h: r.height
      });
    }
    return out;
  };

  /** 顾客带的「长相签名」：只有它变了才整条重绘（每帧只改耐心条宽度，代价极小） */
  UI.custSig = function (run) {
    if (!run || !run.customers) return '';
    return run.customers.slice(-6).map(function (c) {
      return c.uid + ':' + c.state + ':' + (run.selected === c.uid ? 1 : 0);
    }).join('|');
  };

  /** 一位顾客的卡片 */
  function custHtml(c, run) {
    var dish = D.dish(c.dishId) || {};
    var ratio = c.patienceMax ? U.clamp(c.patienceLeft / c.patienceMax, 0, 1) : 1;
    var low = c.state === 'waiting' && ratio <= 0.3;
    var cls = 'cust' +
      (run.selected === c.uid ? ' is-sel' : '') +
      (c.state === 'lost' ? ' is-lost' : '') +
      (c.state === 'served' ? ' is-leaving' : '') +
      (low ? ' is-angry' : '');

    return '<button class="' + cls + '" data-uid="' + esc(c.uid) + '" type="button" ' +
             'aria-label="' + esc(c.name + ' 想要 ' + (dish.name || '')) + '">' +
      '<span class="cust-flag" aria-hidden="true">😤</span>' +
      '<span class="cust-bubble">' +
        '<canvas class="cb-ico" width="16" height="16" aria-hidden="true"></canvas>' +
        '<span class="cb-name">' + esc(dish.name || '') + '</span>' +
      '</span>' +
      '<span class="cust-sprite"><canvas width="48" height="72" aria-hidden="true"></canvas></span>' +
      '<span class="cust-name">' + esc(c.name) + '</span>' +
      '<span class="cust-wait' + (low ? ' is-low' : '') + '"><i style="width:' + Math.round(ratio * 100) + '%"></i></span>' +
      '<span class="cust-tip" aria-hidden="true"></span>' +
    '</button>';
  }

  /** 把像素立绘与菜品图标画进顾客带（无 2D 上下文时安静跳过） */
  function paintCustSprites(host, list) {
    if (!host || !host.querySelectorAll) return 0;
    var n = 0;
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      var card = host.querySelector('[data-uid="' + c.uid + '"]');
      if (!card) continue;
      var body = card.querySelector('.cust-sprite > canvas');
      if (body) n += paintInto(body, P.rectsOf(c.sprite, 3)) > 0 ? 1 : 0;
      var ico = card.querySelector('.cb-ico');
      var dish = D.dish(c.dishId);
      if (ico && dish) n += paintInto(ico, P.rectsOf(dish.sprite, 1)) > 0 ? 1 : 0;
    }
    return n;
  }

  /** 重绘整条顾客带 */
  UI.renderCustBand = function (run) {
    var host = $('custBand');
    if (!host) return false;
    if (!run) run = UI.run;
    if (!run) return false;
    var list = run.customers.slice(-6);
    UI._custSig = UI.custSig(run);
    if (!list.length) {
      host.innerHTML = '<span class="cust-hint">顾客马上就到…</span>';
      return false;
    }
    host.innerHTML = list.map(function (c) { return custHtml(c, run); }).join('');
    paintCustSprites(host, list);
    return true;
  };

  /** 每帧只更新耐心条（不重建 DOM） */
  UI.syncCustBars = function (run) {
    var host = $('custBand');
    if (!host || !host.querySelectorAll) return 0;
    var nodes = host.querySelectorAll('[data-uid]');
    var n = 0;
    for (var i = 0; i < nodes.length; i++) {
      var uid = nodes[i].getAttribute('data-uid');
      var c = null;
      for (var j = 0; j < run.customers.length; j++) {
        if (run.customers[j].uid === uid) { c = run.customers[j]; break; }
      }
      if (!c) continue;
      var ratio = c.patienceMax ? U.clamp(c.patienceLeft / c.patienceMax, 0, 1) : 1;
      var bar = nodes[i].querySelector('.cust-wait');
      if (bar && bar.classList) bar.classList.toggle('is-low', c.state === 'waiting' && ratio <= 0.3);
      var fill = bar && bar.firstElementChild ? bar.firstElementChild : null;
      if (fill && fill.style) fill.style.width = Math.round(ratio * 100) + '%';
      n += 1;
    }
    return n;
  };

  UI.syncPantry = function (run) {
    var host = $('pantryBand');

      host.innerHTML = '<span class="pantry-hint">先接一位顾客，食材台就会摆出这道菜的配料</span>';

    var firstUndone = -1;
    for (var i = 0; i < items.length; i++) {
      if (!items[i].done) { firstUndone = i; break; }

    host.innerHTML = items.map(function (it, idx) {
      var cls = 'pantry-btn' + (it.done ? ' is-done' : (idx === firstUndone ? ' is-target' : ''));

        '<canvas width="32" height="32" aria-hidden="true"></canvas>' +

    var btns = host.querySelectorAll('.pantry-btn');

  UI.syncTools = function (run) {
    var host = $('toolBar');
    if (!host) return false;
    var list = D.TOOLS;
    var sig = list.map(function (t) {
      return t.id + ':' + Math.ceil(TC.Level.toolCdLeft(run, t.id) / 1000);
    }).join(',');
    if (sig === UI._toolSig) return true;
    UI._toolSig = sig;

    if (!UI._toolBuilt) {
      UI._toolBuilt = true;

          '<span aria-hidden="true">' + t.icon + '</span><span class="tt-cd" aria-hidden="true"></span>' +
        '</button>';
      }).join('');

    var btns = host.querySelectorAll('[data-tool]');

  /** 顶栏：倒计时 / 进度条 / 连击 */

    UI.syncPantry(run);

    if (!el || !el.classList) return false;
    el.classList.remove('is-on');
    void el.offsetWidth;
    el.classList.add('is-on');
    return true;
  };

  /** 顾客头上冒一小串金币 +N */

    var host = $('custBand');

    var tip = card && card.querySelector ? card.querySelector('.cust-tip') : null;
    if (tip) {
      tip.textContent = text;

       { transform: 'translateY(-52px) scale(1.15)', opacity: 0 }]);

  /* ------------------------- 与逻辑层对话 ------------------------- */
  UI.tapIngredient = function (ingredientId) {
    var run = UI.run;
    if (!run || run.over) return false;
    var res = TC.Level.tapIngredient(run, ingredientId);
    if (!res.ok) {
      if (res.reason === 'no-order') UI.toast('还没有顾客点单');
      else if (res.reason === 'no-pot') UI.toast('灶台占满了，先出一锅菜');
      else if (res.reason === 'dup') UI.toast('这个配料已经下过了');
      else if (res.reason === 'not-needed') UI.toast('这道菜不用它');

      return false;
    }
    sfx('add');
    UI._pantrySig = null;
    UI._orderSig = null;
    UI.syncPantry(run);
    UI.syncOrder(run);
    if (res.prepDone) UI.stageToast('✅ 备料齐了 · 点锅开火');
    return res;
  };

  UI.tapPot = function (potIdx) {
    var run = UI.run;
    if (!run || run.over) return false;
    var res = TC.Level.tapPot(run, potIdx);
    if (!res.ok) {
      if (res.reason === 'not-prepared') UI.toast('还差 ' + res.missing + ' 样配料');
      else if (res.reason === 'cooking') UI.toast('这锅正在煮，等等就好');
      else if (res.reason === 'ready') UI.toast('已经出锅了，盛到盘子里吧');
      sfx('deny');
      return false;
    }
    sfx('fire');
    UI.stageToast('🔥 开火！');
    UI._orderSig = null;
    UI.syncOrder(run);
    return res;
  };

  UI.pickCustomer = function (uid) {
    var run = UI.run;
    if (!run || run.over) return false;
    if (UI._held != null) {
      var served = UI.servePlateTo(UI._held, uid);
      if (served) return served;
    }
    var res = TC.Level.select(run, uid);
    if (res.ok) {
      sfx('tap');
      UI.renderCustBand(run);
    }
    return res.ok;
  };

  UI.tapFridge = function () {
    var run = UI.run;
    if (!run || run.over) return false;
    var res = TC.Level.tapFridge(run);
    UI.persist();                                  // 彩蛋计数要落盘
    if (res && res.ok && res.penguin) {
      UI.fxPenguin();
      UI.toast('🐧 冰箱里藏着企鹅厨师！钻石 +' + ((res.reward && res.reward.gems) || 0), 'mint');
      sfx('easter');
      vibrate(30);
      UI.updateTopbar();
      UI.refreshBadges();
    } else {
      sfx('tap');
    }
    return res;
  };

  UI.useTool = function (toolId) {
    var run = UI.run;
    if (!run || run.over) return false;
    var res = TC.Level.useTool(run, toolId);
    if (!res.ok) {
      if (res.reason === 'cooldown') UI.toast('道具冷却中（' + Math.ceil((res.left || 0) / 1000) + 's）');
      else if (res.reason === 'no-cooking') UI.toast('现在没有正在煮的锅');
      else if (res.reason === 'no-customer') UI.toast('还没有顾客');
      else if (res.reason === 'no-plate' || res.reason === 'no-match') UI.toast('没有能送出去的菜');
      sfx('deny');
      UI._toolSig = null;
      UI.syncTools(run);
      return false;
    }
    sfx('tool');
    UI._toolSig = null;
    UI.syncTools(run);
    if (res.auto) {
      UI.flyGain(res.customer.uid, '+' + (res.coins + res.tips));
      UI.stageToast('🖐 自动上菜！');
      UI.renderCustBand(run);
      UI._orderSig = null;
      UI.syncOrder(run);
    } else if (toolId === 'warm') {
      UI.syncCustBars(run);
      UI.stageToast('♨️ 耐心回复');
    } else {
      UI.stageToast('⚡ 加速！');
    }
    if (res.rainbow) UI.onRainbow();
    return res;
  };

  UI.onRainbow = function () {
    UI.fxCandy(14);
    UI.toast('🌈 连续 Perfect！彩虹糖撒了一地', 'mint');
    sfx('easter');
    return true;
  };

  /* ------------------------- 装盘 / 拖拽上菜 ------------------------- */
  var drag = null;

  function canvasPoint(e) {
    var cv = $('scene');
    if (!cv || !cv.getBoundingClientRect) return null;
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX || 0) - r.left, y: (e.clientY || 0) - r.top, rect: r };
  }

  /** 当前布局；Scene 还没量过（如 jsdom 没有 2D 上下文）就自己算一份 */
  function layoutOf(run, rect) {
    var lay = TC.Scene.layoutNow ? TC.Scene.layoutNow() : null;
    if (lay) return lay;
    return TC.Scene.layout((rect && rect.width) || 320, (rect && rect.height) || 180, run);
  }
  UI.layoutOf = layoutOf;

  /** 画布坐标（相对 canvas）命中了什么——把 Scene 的纯函数透出来，方便单测 */
  UI.hitAt = function (sx, sy) {
    var run = UI.run;
    if (!run) return null;
    return TC.Scene.hitScreen(run, layoutOf(run, null), sx, sy);
  };

  /** 端起一盘菜（拿在手里，等顾客） */
  UI.holdPlate = function (plateIdx) {
    var run = UI.run;
    if (!run || !run.plates[plateIdx]) return false;
    UI._held = plateIdx;
    UI.toast('🍽 端起「' + run.plates[plateIdx].name + '」，点顾客就上菜', 'mint', 1600);
    return true;
  };

  /** 点一下盘子：拿起 / 放下 */
  UI.plateTap = function (plateIdx) {
    if (UI._held === plateIdx) {
      UI._held = null;
      UI.stageToast('🍽 放回出餐台');
      return false;
    }
    return UI.holdPlate(plateIdx);
  };

  UI.startDrag = function (p) {
    var run = UI.run;
    if (!run || UI._held == null) return false;
    var plate = run.plates[UI._held];
    if (!plate) return false;
    var ghost = null;
    var host = $('flyLayer');
    if (host && host.appendChild && typeof document !== 'undefined' && document.createElement) {
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      var cv = P.toCanvas(plate.sprite, 2);
      if (cv) ghost.appendChild(cv);
      host.appendChild(ghost);
    }
    drag = { plateIdx: UI._held, ghost: ghost };
    UI.moveDrag(p.x, p.y);
    return true;
  };

  UI.moveDrag = function (lx, ly) {
    if (!drag || !drag.ghost || !drag.ghost.style) return false;
    drag.ghost.style.transform = 'translate(' + (lx - 16) + 'px,' + (ly - 16) + 'px)';
    return true;
  };

  UI.cancelDrag = function () {
    if (drag && drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    drag = null;
    return true;
  };

  UI.isDragging = function () { return !!drag; };

  /** 按下画布：点冰箱 / 点锅 / 端起盘子 */
  UI.sceneDown = function (e) {
    var run = UI.run;
    if (!run || run.over || drag) return false;
    var p = canvasPoint(e);
    if (!p) return false;
    var hit = TC.Scene.hitScreen(run, layoutOf(run, p.rect), p.x, p.y);
    if (!hit) return false;

    if (hit.kind === 'fridge') { UI.tapFridge(); return true; }

    if (hit.kind === 'pot') {
      var pot = run.pots[hit.index];
      if (pot && pot.state === 'ready') {
        var r = TC.Level.toPlate(run, hit.index);
        if (r.ok) {
          sfx('plate');
          UI.stageToast('🍽 装盘');
          UI._orderSig = null;
          UI.syncOrder(run);
          UI.holdPlate(r.plateIdx);
          UI.startDrag(p);
        }
        return true;
      }
      UI.tapPot(hit.index);
      return true;
    }

    if (hit.kind === 'counter') {
      if (hit.plateIndex >= 0) { UI.plateTap(hit.plateIndex); UI.startDrag(p); return true; }
      UI.toast('出餐台空着，先在锅里出菜');
      return true;
    }

    if (hit.kind === 'register') { UI.toast('🪙 收银台：上菜自动记账'); return true; }
    return false;
  };

  UI.dragMove = function (e) {
    if (!drag) return false;
    var p = canvasPoint(e);
    if (!p) return false;
    UI.moveDrag(p.x, p.y);
    UI.highlightCust(TC.Scene.customerAt(UI.custRects(), e.clientX, e.clientY));
    return true;
  };

  /** 松手：落在顾客身上就上菜；没落中就把菜继续拿在手里 */
  UI.dragUp = function (e) {
    if (!drag) return false;
    var plateIdx = drag.plateIdx;
    UI.cancelDrag();
    UI.highlightCust(null);
    var uid = TC.Scene.customerAt(UI.custRects(), e.clientX, e.clientY);
    if (uid) return UI.servePlateTo(plateIdx, uid);
    return false;
  };

  /** 上菜（唯一入口：拖拽落点 / 点顾客 / 点盘子都走这里） */
  UI.servePlateTo = function (plateIdx, uid) {
    var run = UI.run;
    if (!run || run.over) return false;
    var res = TC.Level.serve(run, plateIdx, uid);
    if (!res.ok) {
      if (res.reason === 'dish-mismatch') UI.toast('🤔 他要的不是这道菜', 'gold');
      else if (res.reason === 'not-waiting') UI.toast('这位顾客已经不在等了');
      sfx('deny');
      return false;
    }
    UI._held = null;
    UI.flyGain(uid, '+' + num(res.coins + res.tips));
    if (res.perfect) {
      UI.stageToast('PERFECT!');
      sfx('perfect');
      vibrate(20);
    } else {
      sfx('serve');
    }
    if (res.combo >= 3) UI.stageToast('×' + res.combo + ' 连击');
    if (res.rainbow) UI.onRainbow();
    UI._orderSig = null;
    UI._pantrySig = null;
    UI.renderCustBand(run);
    UI.syncOrder(run);
    UI.syncPantry(run);
    return res;
  };

  /* ------------------------- 事件流 ------------------------- */
  UI.onRunEvents = function (run, events) {
    if (!events || !events.length) return 0;
    var n = 0;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.type === 'ready') { UI.stageToast('🔥 出锅！'); sfx('ready'); n += 1; }
      else if (e.type === 'lost') { UI.toast('😤 ' + e.customer.name + ' 等太久走了', 'red'); sfx('lost'); n += 1; }
      else if (e.type === 'plate-expired') { UI.toast('🍽 一盘菜凉掉了', 'red'); n += 1; }
      else if (e.type === 'helper-prep') { UI.stageToast('👩‍🍳 帮厨备料'); n += 1; }
      else if (e.type === 'auto-serve') {
        UI.flyGain(e.customer.uid, '+' + num((e.coins || 0) + (e.tips || 0)));
        n += 1;
      } else if (e.type === 'spawn') { sfx('door'); n += 1; }
    }
    return n;
  };

  /** 一局结束（TC.Scene.step 在 run.over 时调用） */
  UI.onRunOver = function (run) {
    if (!run || run !== UI.run || UI._settled) return false;
    UI._settled = true;
    UI.result = TC.Level.finish(UI.save, run);     // 结算与写档全部在逻辑层
    UI.persist();
    TC.Scene.stop();
    TC.Router.go('result');
    return UI.result;
  };

  /* ------------------------- 进入 / 离开经营页 ------------------------- */
  var cookBound = false;
  function bindCook() {
    if (cookBound) return;
    cookBound = true;

    var cv = $('scene');
    on(cv, 'pointerdown', function (e) {
      if (e.preventDefault) e.preventDefault();
      UI.sceneDown(e);
    });
    on(document, 'pointermove', function (e) { if (drag) UI.dragMove(e); });
    on(document, 'pointerup', function (e) { if (drag) UI.dragUp(e); });
    on(document, 'pointercancel', function () { UI.cancelDrag(); });

    on($('custBand'), 'click', function (e) {
      var card = closest(e.target, '[data-uid]');
      if (card) UI.pickCustomer(card.getAttribute('data-uid'));
    });
    on($('pantryBand'), 'click', function (e) {
      var b = closest(e.target, '[data-ing]');
      if (b) UI.tapIngredient(b.getAttribute('data-ing'));
    });
    on($('toolBar'), 'click', function (e) {
      var b = closest(e.target, '[data-tool]');
      if (b) UI.useTool(b.getAttribute('data-tool'));
    });
  }

  /**
   * 进入经营页：重置本页缓存 → 首帧渲染 → 启动 Canvas 循环
   * @param {{loop?:boolean}} [opts] loop:false 时不跑 rAF（单测手动 step，保证确定性）
   */
  UI.enterCook = function (opts) {
    opts = opts || {};
    var run = UI.run;
    if (!run) return false;
    bindCook();

    UI._settled = false;
    UI._held = null;
    UI._custSig = null;
    UI._orderSig = null;
    UI._pantrySig = null;
    UI._toolSig = null;
    UI._tbTime = null;
    UI._combo = -1;
    UI._toolBuilt = false;
    UI.cancelDrag();

    UI.renderCustBand(run);
    UI.syncOrder(run);
    UI.syncPantry(run);
    UI.syncTools(run);
    UI.syncCookTopbar(run);

    TC.Scene.stop();                                // 先停掉可能还在跑的上一局循环
    TC.Scene.start(run, { loop: opts.loop === false ? false : true });
    return true;
  };

  UI.leaveCook = function () {
    TC.Scene.stop();
    UI.cancelDrag();
    UI.holdClear();
    return true;
  };

  UI.holdClear = function () { UI._held = null; return true; };

  /* ------------------------- 顶栏操作扩展 ------------------------- */
  UI.isCookRunning = function () { return !!(TC.Scene.isRunning && TC.Scene.isRunning()); };

  /* ========================================================================
     页面 3 · 结算
     ======================================================================== */

  /** 三条星级条件逐条展示（达成打勾，没达成给出还差多少） */
  function condHtml(c) {
    var val = num(c.val) + (c.unit || '');
    var gap = c.ok ? '' : ('还差 ' + num(Math.max(0, c.goal - c.val)) + (c.unit || ''));
    return '<div class="res-cond ' + (c.ok ? 'is-ok' : 'is-fail') + '">' +

      ctx.fillStyle = P.PALETTE.k;

    opts = opts || {};
    if (!R.has(name)) return false;
    if (name === R.current && !opts.force) return true;

    var old = R.current ? R._views[R.current] : null;
    if (old) old.classList.remove('is-active');
    var next = R._views[name];
    next.classList.add('is-active');

    R.prev = R.current;
    R.current = name;

    if (opts.tab) R.activeTab = opts.tab;
    if (!opts.silent) {
      for (var i = 0; i < R._onChange.length; i++) {
        try { R._onChange[i](name, R.prev, opts); } catch (e) { /* 单个监听器失败不影响路由 */ }
      }
    }
    return true;
  };

  R.back = function () {
    if (R.prev && R.has(R.prev)) { var p = R.prev; R.prev = null; return R.go(p); }
    return R.go('map');
  };

  R.onChange = function (fn) { R._onChange.push(fn); return fn; };

  /** 视图↔底部导航的可见性策略 */
  R.navVisibleFor = function (name) { return name === 'map'; };

  /** 视图↔顶栏文案策略 */
  R.topbarFor = function (name) {
    switch (name) {
      case 'map':    return { center: 'Travel Chefs', tag: '', action: 'gear' };
      case 'levels': return { center: '', tag: '', action: 'back' };
      case 'cook':   return { center: '', tag: '', action: 'pause' };
      case 'result': return { center: '本局结算', tag: '', action: 'none' };
      /* 图鉴页顶栏中间留空：页内已有「图鉴/成就/每日任务」标签，再写一遍是重复信息。
         注意只清空 center —— 左边的金币/钻石和右边的返回按钮不受影响。 */
      case 'codex':  return { center: '', tag: '', action: 'back' };
      default:       return { center: '', tag: '', action: 'none' };
    }
  };

  TC.Router = R;
})(TC);

/* --------------------------------------------------------------------------
   启动
   -------------------------------------------------------------------------- */
(function (TC) {
  'use strict';
  TC.boot = function () {
    if (TC.booted) return false;       // 幂等：DOMContentLoaded 与手动调用只会启动一次
    TC.booted = true;
    try {
      TC.Router.scan();
      if (TC.UI && TC.UI.init) TC.UI.init();
      TC.Router.go('map', { silent: true });
      if (TC.UI && TC.UI.onRoute) TC.UI.onRoute('map', null, {});
      TC.Router.onChange(function (n, p, o) { if (TC.UI && TC.UI.onRoute) TC.UI.onRoute(n, p, o); });
      TC.bootError = null;
    } catch (e) {
      TC.bootError = e;
      if (typeof console !== 'undefined' && console.error) console.error('[TC] boot failed:', e);
    }
    return true;
  };

  // 仅在真实 DOM 就绪时启动；纯逻辑单测可手动调用 TC.boot()
  if (typeof document !== 'undefined' && document.getElementById && document.getElementById('app')) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', TC.boot);
    } else {
      TC.boot();
    }
  }
})(TC);
</script>
</body>
